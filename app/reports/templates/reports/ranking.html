{% load l10n %}<section class="panel chart"><div class="section-head"><div><h2>{{ title }}</h2><p>{{ subtitle }}</p></div><span class="tag">İlk 10</span></div><div class="bar-list">{% for r in rows %}<div class="bar-item"><div><span>{{ r.who }}</span><strong>{{ r.total }}</strong></div><div class="track"><span class="bar {{ color }}" style="width:{% localize off %}{{ r.width }}{% endlocalize %}%"></span></div></div>{% empty %}<div class="empty compact"><p>Seçili aralıkta bu işlem türünde kayıt yok.</p></div>{% endfor %}</div></section>
