{% load static %}<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş | Ufuk-FileAudit</title><link rel="stylesheet" href="{% static 'reports/app.css' %}"></head><body class="auth"><main class="auth-card"><div class="brand"><span class="mark">U<span>F</span></span><span>Ufuk-FileAudit<small>DOSYA DENETİM MERKEZİ</small></span></div><h1>Hesabınıza giriş yapın</h1><p>Dosya hareketlerini ve kullanım raporlarını güvenle izleyin.</p>{% if form.errors %}<div class="alert error">Kullanıcı adınızı ve parolanızı kontrol edin.</div>{% endif %}<form method="post">{% csrf_token %}<label>Kullanıcı adı<input name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"></label><label>Parola<input name="password" type="password" autocomplete="current-password" required></label><input type="hidden" name="next" value="{{ next }}"><button class="btn primary" type="submit">Giriş yap →</button></form><div class="auth-foot">Ufuk-FileAudit · Dosya denetim merkezi</div></main></body></html>
